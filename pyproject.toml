[project]
name = "quant-screener"
version = "0.1.0"
description = "Dual-market leak-free quantitative screener (Sprint 1 scaffolding)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "psutil>=5.9",
    "pytest>=8",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "xgboost-cpu>=2.1",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
